document.getElementById("pp-optfile").addEventListener("change", async (e) => {

render();
(async () => {
  const [u, d, a] = await Promise.all([claude.use("user").catch(() => null), claude.use("db").catch(() => null), claude.use("assets").catch(() => null)]);
  userCap = u; db = d; assets = a;
  if (u) { try { S.studio = !!(await u.canEdit()); S.me = await u.id(); } catch {} }
  if (!db) { S.reqState = "off"; loadSample(); render(); return; }
  /* published brand book: the version the studio saved for everyone, else the sample */
  let bookSeen = false;
  const bookTimer = setTimeout(() => { if (!bookSeen && !S.client) loadSample(); }, 10000);
  db.doc("portal/book").onSnapshot((snap) => {
    if (snap.fromCache && !snap.exists) return;
    bookSeen = true; clearTimeout(bookTimer);
    if (snap.exists) loadSaved(snap.data()); else if (!S.client) loadSample();
  }, () => { clearTimeout(bookTimer); if (!S.client) loadSample(); });
  /* questionnaire answers shared with the studio */
  db.doc("brief/answers").onSnapshot((snap) => {
    if (!snap.exists || snap.hasPendingWrites) return;
    const v = snap.data(); if (!v?.answers || typeof v.answers !== "object") return;
    const local = JSON.parse(store.get("pp-answers") || "null");
    if (local?.at && v.at && local.at > v.at) return;
    S.answers = { ...Q.answers, ...v.answers }; S.briefFrom = "db"; S.briefAt = v.at || null;
    if (S.view === "brief" && !document.activeElement?.closest?.(".pb-q")) render(); else setBriefNote();
  }, () => {});
  /* requests */
  const reqTimer = setTimeout(() => { if (S.reqState === "loading") { S.reqState = "slow"; render(); } }, 10000);
  /* the plan the studio set, and asks about one */
  db.doc("portal/plan").onSnapshot((snap) => { S.plan = snap.exists ? snap.data() : null; render(); }, () => {});
  db.collection("planasks").orderBy("at", "desc").onSnapshot((snap) => { S.asks = snap.docs.map((x) => ({ id: x.id, ...x.data() })); render(); }, () => {});
  db.collection("requests").orderBy("at", "desc").onSnapshot((snap) => {
    S.requests = snap.docs.map((x) => ({ id: x.id, ...x.data() }));
    if (!snap.fromCache) { clearTimeout(reqTimer); S.reqState = "ok"; } else if (S.reqState === "loading") S.reqState = "ok";
    resolveNames(); render();
  }, () => { clearTimeout(reqTimer); S.reqState = "error"; render(); });
  render();

async function resolveNames() {
  if (!userCap?.profiles) return;
  const ids = [...new Set([...S.requests.flatMap((r) => [r.by, r.delivery?.by, ...(r.notes || []).map((n) => n.by)]), ...S.asks.map((a) => a.by)].filter((x) => x && x !== S.me && !(x in S.names)))];
  if (!ids.length) return;
  try { const ps = await userCap.profiles(ids); for (const id of ids) S.names[id] = ps?.[id]?.name || ""; render(); } catch {}
}
