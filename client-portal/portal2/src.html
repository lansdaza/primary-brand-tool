<title>Primary Client Portal</title>
<style>/*__UICSS__*/.pb-page--book{max-width:78rem;padding-inline:clamp(var(--space-m),3vw,var(--space-xxl))}

.pp-booknav button:hover{color:var(--neutral-10);background:var(--pb-hover)}
.pp-booknav button[aria-current]{background:var(--neutral-10);color:var(--neutral-1)}
</style>
<style>/*__TPLCSS__*/</style>
<style>/*__BRANDCSS__*/</style>
<style id="pp-fonts"></style>
<style>
/*__PUBCSS__*/
/* Portal additions, written only with the Brand Tool's own tokens */
.pp-flagbtn{display:flex;flex-direction:column;gap:var(--space-xs);width:100%;min-width:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.pp-flagbtn:hover h2{text-decoration:underline;text-underline-offset:.2em}
.pp-flagbtn:focus-visible{outline:2px solid var(--neutral-10);outline-offset:4px;border-radius:var(--radius-s)}
.pb-flag .pp-dot{pointer-events:none}
.pp-picks{display:flex;flex-wrap:wrap;gap:var(--space-xxs)}
.pp-picks .pb-pill{cursor:pointer}
.pp-picks .pb-pill[aria-pressed=true]{background:var(--neutral-10);color:var(--neutral-1)}
.pp-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs)}
.pp-field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:var(--space-s)}
.pp-input{width:100%;min-height:calc(var(--line-s) + var(--space-s) * 2);padding:var(--space-s);border:0;border-radius:var(--radius-s);background:var(--pb-ground);box-shadow:inset 0 0 0 var(--border-s) var(--pb-line);color:var(--neutral-10);font:var(--weight-ui-regular) var(--size-s)/var(--line-s) var(--font-ui)}
.pp-input:focus-visible{outline:none;background:var(--pb-panel);box-shadow:inset 0 0 0 var(--border-l) var(--neutral-10)}
.pp-thumb{display:block;width:100%;max-width:14rem;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius-s);background:var(--pb-ground);box-shadow:inset 0 0 0 var(--border-s) var(--pb-line)}
.pp-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:var(--space-s)}
.pp-opt{display:flex;flex-direction:column;gap:var(--space-s);min-width:0;padding:var(--space-s);border-radius:var(--radius-m);background:var(--pb-panel);box-shadow:inset 0 0 0 var(--border-s) var(--pb-line)}
.pp-opt[data-rec]{box-shadow:inset 0 0 0 var(--border-l) var(--neutral-10)}
.pp-opt-hero{grid-column:1/-1}
.pp-opt-media{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;overflow:hidden;border-radius:var(--radius-s);background:var(--pb-ground)}
.pp-opt-hero .pp-opt-media{aspect-ratio:16/9}
.pp-opt-media img,.pp-opt-media video{width:100%;height:100%;object-fit:contain}
.pp-opt-media span{color:var(--pb-sub);font-size:var(--size-xs)}
.pp-opt-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-xs);min-width:0}
.pp-opt-head strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--weight-ui-medium);font-size:var(--size-xs)}
.pp-caption{margin:0;color:var(--pb-body);font-size:var(--size-s);line-height:var(--line-s);white-space:pre-wrap;overflow-wrap:anywhere}
.pp-msg{margin:0;padding:var(--space-s) var(--space-m);border-radius:var(--radius-m);background:var(--pb-hover);color:var(--neutral-10);white-space:pre-wrap;overflow-wrap:anywhere}
.pp-msg small{display:block;margin-bottom:var(--space-xxs);color:var(--pb-sub);font-size:var(--size-xs)}
.pp-block{display:flex;flex-direction:column;gap:var(--space-s);margin-bottom:var(--space-xl)}
.pp-block>h2{margin:0;padding-bottom:var(--space-xs);box-shadow:inset 0 calc(-1 * var(--border-s)) 0 var(--pb-line);font:var(--weight-ui-medium) var(--size-s)/var(--line-s) var(--font-ui)}
.pp-studio{padding:var(--space-m);border-radius:var(--radius-m);box-shadow:inset 0 0 0 var(--border-s) var(--pb-line)}
.pp-note{margin:0;color:var(--pb-sub);font-size:var(--size-xs);line-height:var(--line-s)}
.pp-note[data-tone=bad]{color:var(--error)}
.pp-status{margin:0 0 var(--space-m);padding:0 0 0 var(--space-m);color:var(--pb-body);font-size:var(--size-xs);line-height:var(--line-s)}
.pp-status li+li{margin-top:var(--space-xxs)}
.pp-status li[data-tone=bad]{color:var(--error)}
.pp-status li[data-tone=good]{color:var(--neutral-10);font-weight:var(--weight-ui-medium)}
.pp-history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-xs)}
.pp-history li{display:flex;flex-direction:column;gap:2px;font-size:var(--size-xs);color:var(--pb-body)}
.pp-history li span{color:var(--pb-sub)}
.pp-dropmask{position:fixed;inset:0;z-index:10002;display:grid;place-items:center;background:color-mix(in srgb,var(--neutral-10) 30%,transparent);pointer-events:none}
.pp-dropmask div{padding:var(--space-l) var(--space-xl);border-radius:var(--radius-m);background:var(--pb-panel);box-shadow:inset 0 0 0 var(--border-l) var(--neutral-10);font:var(--weight-ui-medium) var(--size-s)/var(--line-s) var(--font-ui);color:var(--neutral-10)}
.pp-brandpick{cursor:pointer}
.pp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.pb-pb-dlrow .themed-button{justify-self:end}
.pp-files{display:flex;flex-direction:column;gap:var(--space-xl)}
.pp-files section{display:flex;flex-direction:column;gap:var(--space-s);scroll-margin-top:var(--space-l)}
.pp-files h2{margin:0;padding-bottom:var(--space-xs);box-shadow:inset 0 calc(-1 * var(--border-s)) 0 var(--pb-line);font:var(--weight-ui-medium) var(--size-s)/var(--line-s) var(--font-ui)}
.pp-galmini{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:var(--space-xs)}
.pp-galmini figure{margin:0;display:flex;align-items:center;justify-content:center;aspect-ratio:1;overflow:hidden;border-radius:var(--radius-s);background:var(--pb-ground)}
.pp-galmini figure[data-dark]{background:#1b1b1b}
.pp-galmini img{max-width:80%;max-height:80%;object-fit:contain}
/* Brand reveal: slides drawn at 1600×900 in the client's brand, scaled to the stage */
.pp-stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:var(--radius-m);background:var(--pb-ground);box-shadow:inset 0 0 0 var(--border-s) var(--pb-line)}
.pp-stage-fit{position:absolute;inset:0;overflow:hidden}
.pp-stage-fit>.pp-rv{position:absolute;left:0;top:0;transform-origin:0 0}
.pp-stage-bar{display:flex;align-items:center;gap:var(--space-xs);margin:var(--space-s) 0 var(--space-xl)}
.pp-grow{flex:1}
.a.pp-rv{width:1600px;height:900px;padding:88px 96px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.a .pp-rv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:40px}
.a .pp-rv-logo{display:block;height:44px;width:auto}
.a .pp-rv-eyebrow{font-size:17px;letter-spacing:.06em;opacity:.7;white-space:pre}
.a .pp-rv-foot{display:flex;flex-direction:column;gap:28px}
.a .pp-rv-giant{font-size:230px;line-height:.86}
.a .pp-rv-tags{display:flex;flex-wrap:wrap;gap:12px;font-size:17px}
.a .pp-rv-split{display:grid;grid-template-columns:1.35fr 1fr;gap:110px;align-items:end;flex:1;padding-top:40px}
.a .pp-rv-statement{font-size:82px;line-height:1}
.a .pp-rv-words{list-style:none;display:flex;flex-direction:column}
.a .pp-rv-words li{font-size:40px;line-height:1.1;padding:14px 0;box-shadow:inset 0 -1px 0 color-mix(in srgb,currentColor 25%,transparent)}
.a.pp-rv-halves{padding:0;flex-direction:row}
.a.pp-rv-halves>div{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:88px 96px;min-width:0}
.a .pp-rv-biglogo{display:block;width:78%;height:220px;object-fit:contain;align-self:center;margin:auto 0}
.a .pp-rv-note{font-size:22px;line-height:1.35;max-width:620px;opacity:.75}
.a .pp-rv-palette{display:flex;flex-direction:column;gap:18px;flex:1;margin-top:44px}
.a .pp-rv-bars{display:flex;flex:1;overflow:hidden;border-radius:10px}
.a .pp-rv-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:20px;font-size:15px;min-width:0}
.a .pp-rv-bar strong{font-size:20px;font-weight:400}
.a .pp-rv-aa{font-size:430px;line-height:.78;letter-spacing:-.04em}
.a .pp-rv-fams{display:flex;flex-direction:column;gap:26px}
.a .pp-rv-fams>div{display:flex;flex-direction:column;gap:8px;padding-bottom:22px;box-shadow:inset 0 -1px 0 color-mix(in srgb,currentColor 25%,transparent)}
.a .pp-rv-fams .a-sub{font-size:46px}
.a .pp-rv-sample{font-size:58px;line-height:1}
.a.pp-rv-imagery{padding:0;position:relative}
.a .pp-rv-grid{position:absolute;inset:0;display:grid;gap:6px;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr}
.a .pp-rv-grid[data-n="1"]{grid-template-columns:1fr;grid-template-rows:1fr}
.a .pp-rv-grid[data-n="2"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.a .pp-rv-grid[data-n="3"]{grid-template-columns:2fr 1fr}
.a .pp-rv-grid[data-n="4"]{grid-template-columns:2fr 1fr 1fr}
.a .pp-rv-grid img{display:block;width:100%;height:100%;object-fit:cover;min-height:0}
.a .pp-rv-grid img:first-child{grid-row:span 2}
.a .pp-rv-grid[data-n="1"] img:first-child,.a .pp-rv-grid[data-n="2"] img:first-child{grid-row:auto}
.a .pp-rv-over{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:20px;padding:120px 96px 80px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.a .pp-rv-over .pp-rv-eyebrow{opacity:.9}
.a .pp-rv-quotes{display:flex;flex-direction:column;justify-content:center;gap:26px;flex:1}
.a .pp-rv-quote{font-size:96px;line-height:1}
.a .pp-rv-line{font-size:40px;line-height:1.15;opacity:.75}
.a.pp-rv-use{flex-direction:row;align-items:center;gap:56px;padding:88px 72px 88px 96px}
.a .pp-rv-usecap{width:330px;flex:none;display:flex;flex-direction:column;gap:16px}

.a .pp-rv-usecap span:last-child{font-size:20px;line-height:1.4;opacity:.7}
.a.pp-rv-use img{flex:1;min-width:0;width:100%;height:auto;border-radius:12px;box-shadow:0 30px 60px -40px rgba(0,0,0,.35)}
.a .pp-rv-headline{font-size:124px;line-height:.94;white-space:pre-line}
.a .pp-rv-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:56px;margin-top:20px}
.a .pp-rv-cols strong{display:block;margin-bottom:12px;font-size:30px;font-weight:400}
.a .pp-rv-cols p{font-size:20px;line-height:1.4;opacity:.72}
.pp-present{position:fixed;inset:0;z-index:10003;background:#000;outline:none}
.pp-present .pp-stage-fit{position:absolute;inset:0;cursor:pointer}
.pp-present-bar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:var(--space-xs);padding:var(--space-xxs) var(--space-s);border-radius:var(--radius-full);background:rgba(28,28,28,.82);opacity:0;transition:opacity var(--motion-duration,200ms) ease}
.pp-present:hover .pp-present-bar,.pp-present:focus-within .pp-present-bar{opacity:1}
@media (hover:none){.pp-present-bar{opacity:1}}
/* The offer, after the brand in use; plan and account */
.pp-offer{display:flex;flex-direction:column;gap:var(--space-m);padding:var(--space-l);margin-bottom:var(--space-xl);border-radius:var(--radius-m);background:var(--pb-panel);box-shadow:inset 0 0 0 var(--border-s) var(--pb-line)}
.pp-offer.is-compact{padding:var(--space-m)}
.pp-offer-head h2{margin:0;font:var(--weight-ui-medium) var(--size-l)/1.2 var(--font-ui);color:var(--neutral-10)}
.pp-offer-head p{margin:var(--space-xxs) 0 0;max-width:38rem;color:var(--pb-body)}
.pp-offer-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-xs)}
.pp-offer-list li{display:flex;align-items:flex-start;gap:var(--space-xs);color:var(--pb-body);font-size:var(--size-s);line-height:var(--line-s)}
.pp-offer-list svg{flex:none;margin-top:2px;color:var(--neutral-10)}
.pp-link{padding:0;border:0;background:none;color:var(--neutral-10);font:inherit;text-decoration:underline;text-underline-offset:.2em;cursor:pointer}
@media (max-width:640px){.pp-stage-bar .pp-note{font-size:var(--size-xs)}.pp-offer{padding:var(--space-m)}}
.pp-galmini figure.is-photo img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover}
/* ---------- v1.1: home, review, library ---------- */
.pb-page--book .pb-pb-sec{content-visibility:auto;contain-intrinsic-size:auto 900px}
.pp-grow{flex:1}
.pp-gap{height:var(--space-l)}
.pp-av{flex:none;display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:var(--radius-full);background:var(--neutral-10);color:var(--neutral-1);font:var(--weight-ui-medium) var(--size-xxs)/1 var(--font-ui);letter-spacing:.02em}
.pp-card{display:flex;flex-direction:column;gap:var(--space-s);padding:var(--space-m);border-radius:var(--radius-m);background:var(--pb-panel);box-shadow:inset 0 0 0 var(--border-s) var(--pb-line);min-width:0}
.pp-card>h2{margin:0;font:var(--weight-ui-medium) var(--size-s)/var(--line-s) var(--font-ui)}
/* home */
.pp-hero{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-xl);min-height:clamp(15rem,32vw,22rem);padding:clamp(1.25rem,3.5vw,2.5rem);border-radius:var(--radius-m);overflow:hidden}
.pp-hero-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-m)}
.pp-hero-logo{display:block;height:clamp(1.5rem,3vw,2.25rem);width:auto;max-width:14rem;object-fit:contain;object-position:left center}
.pp-hero-by{font-size:.72rem;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
.pp-hero-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-l);flex-wrap:wrap}
.pp-hero-title{margin:0;max-width:16ch;font-size:clamp(2rem,5vw,3.75rem);line-height:1.02}
.pp-hero-meet{display:flex;flex-direction:column;gap:2px;padding:var(--space-s) var(--space-m);border-radius:var(--radius-s);background:color-mix(in srgb,currentColor 10%,transparent);font:var(--size-xs)/1.35 var(--font-ui)}
.pp-hero-meet .a-mono{font-size:.68rem;opacity:.7;text-transform:uppercase;letter-spacing:.06em}
.pp-hero-meet strong{font-size:var(--size-s);font-weight:var(--weight-ui-medium)}
.pp-steps{list-style:none;margin:var(--space-m) 0 var(--space-l);padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-xxs)}
.pp-steps li{display:flex;align-items:center;gap:var(--space-xs);padding:var(--space-xs) 0 0;box-shadow:inset 0 2px 0 var(--pb-line);color:var(--pb-sub);font-size:var(--size-xs);min-width:0}
.pp-steps li>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-steps li[data-state=done]{box-shadow:inset 0 2px 0 var(--neutral-10);color:var(--pb-body)}
.pp-steps li[data-state=now]{box-shadow:inset 0 2px 0 var(--neutral-10);color:var(--neutral-10);font-weight:var(--weight-ui-medium)}
.pp-step-dot{flex:none;display:grid;place-items:center;width:1.25rem;height:1.25rem;border-radius:var(--radius-full);box-shadow:inset 0 0 0 var(--border-s) var(--pb-line);font-size:var(--size-xxs);font-variant-numeric:tabular-nums}
.pp-step-dot .lucide{width:12px;height:12px}
.pp-steps li[data-state=done] .pp-step-dot,.pp-steps li[data-state=now] .pp-step-dot{background:var(--neutral-10);color:var(--neutral-1);box-shadow:none}
.pp-homegrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--space-m);align-items:start}
.pp-homecol{display:flex;flex-direction:column;gap:var(--space-m);min-width:0}
.pp-waitlist,.pp-actlist,.pp-team,.pp-teamedit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pp-waitlist button,.pp-actlist button{width:100%;display:flex;align-items:center;gap:var(--space-s);padding:var(--space-xs);margin:0 calc(-1 * var(--space-xs));border:0;border-radius:var(--radius-s);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;box-sizing:content-box}
.pp-waitlist button:hover,.pp-actlist button:hover{background:var(--pb-hover)}
.pp-waitlist img{flex:none;width:3rem;height:3rem;object-fit:cover;border-radius:var(--radius-s);background:var(--pb-ground)}
.pp-waitdot{flex:none;width:.5rem;height:.5rem;margin:0 .25rem;border-radius:var(--radius-full);background:var(--neutral-10)}
.pp-waitlist button>span:not(.pp-av):not(.pp-waitdot),.pp-actlist button>span:not(.pp-av),.pp-team li>span:not(.pp-av){flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pp-waitlist strong{font-weight:var(--weight-ui-medium);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-waitlist small,.pp-actlist small,.pp-team small{color:var(--pb-sub);font-size:var(--size-xs)}
.pp-waitlist .lucide{color:var(--pb-sub)}
.pp-actlist li{position:relative}

.pp-actlist button>span>span{color:var(--pb-body);overflow-wrap:anywhere}
.pp-actlist strong{color:var(--neutral-10);font-weight:var(--weight-ui-medium)}
.pp-team li{display:flex;align-items:center;gap:var(--space-s);padding:var(--space-xs) 0}
.pp-team strong{font-weight:var(--weight-ui-medium)}
.pp-meter{height:.4rem;border-radius:var(--radius-full);background:var(--pb-hover);overflow:hidden}
.pp-meter i{display:block;height:100%;background:var(--neutral-10);border-radius:inherit}
.pp-plancard .pp-link{align-self:flex-start}
.pp-projstudio{margin:0 0 var(--space-m)}

.pp-projstudio>summary::-webkit-details-marker{display:none}

.pp-teamedit{gap:var(--space-xs)}
.pp-teamedit li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:var(--space-xs);align-items:center}
.pp-inviteform{display:flex;flex-direction:column;gap:var(--space-xs);padding-top:var(--space-xs);box-shadow:inset 0 var(--border-s) 0 var(--pb-line)}
.pp-locked{align-items:center;text-align:center}
.pp-locked>.lucide{width:24px;height:24px;color:var(--pb-sub)}
/* request form */
.pp-examples{display:flex;flex-direction:column;gap:var(--space-xs)}
.pp-examples .pb-pill{cursor:pointer}
.pp-examples .pb-pill:hover{background:var(--pb-hover)}
.pp-likecard{display:flex;align-items:center;gap:var(--space-s);padding:var(--space-xs);border-radius:var(--radius-m);box-shadow:inset 0 0 0 var(--border-s) var(--pb-line)}
.pp-likecard img{flex:none;width:4rem;height:4rem;object-fit:cover;border-radius:var(--radius-s);background:var(--pb-ground)}
